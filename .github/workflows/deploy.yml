name: Deploy to Coolify

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Coolify (Dev Environment)
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          response=$(curl -s -w "\n%{http_code}" --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Deployment triggered successfully"
          else
            echo "❌ Deployment failed with status $http_code"
            exit 1
          fi

      - name: Deploy Preview (Pull Request)
        if: github.event_name == 'pull_request'
        id: deploy_preview
        run: |
          echo "🚀 Triggering preview deployment for PR #${{ github.event.pull_request.number }}"

          response=$(curl -s -w "\n%{http_code}" --request GET '${{ secrets.COOLIFY_WEBHOOK_URL }}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)

          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]; then
            echo "✅ Preview deployment triggered successfully"
            echo "status=success" >> $GITHUB_OUTPUT
          else
            echo "❌ Preview deployment failed with status $http_code"
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Comment on PR (Success)
        if: github.event_name == 'pull_request' && steps.deploy_preview.outputs.status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '�� **Preview deployment triggered!**\n\n✅ Deployment started successfully.\n\n**Details:**\n- Branch: `${{ github.head_ref }}`\n- Commit: `${{ github.event.pull_request.head.sha }}`\n\n📊 Check the [Coolify dashboard](https://wedding.rz-codes.com) for deployment progress.'
            })

      - name: Comment on PR (Failed)
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '❌ **Preview deployment failed!**\n\nPlease check the [GitHub Actions logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
